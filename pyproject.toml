[project]
name = "commerce-research"
version = "0.1.0"
description = "Local multi-agent commerce research workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1", "deepagents>=0.3,<1", "langchain>=1,<2",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "langchain-openai>=1,<2",
  "aiosqlite>=0.21,<1", "redis>=6,<9", "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7", "numpy>=2,<3", "pandas>=2.2,<4", "matplotlib>=3.9,<4", "pypdf>=5,<7"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests", "backend/app/engine/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


